<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" fill="none">
  <defs>
    <radialGradient id="heroDarkBg2" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#181a20"/>
      <stop offset="50%" stop-color="#0c0d10"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <radialGradient id="heroGlow2" cx="60%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#f58220" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldCardGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#deb841"/>
      <stop offset="30%" stop-color="#fae7a5"/>
      <stop offset="60%" stop-color="#cca22e"/>
      <stop offset="100%" stop-color="#b68921"/>
    </linearGradient>
    <filter id="cardShadow2" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-15" dy="30" stdDeviation="35" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#d4af37" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1600" height="800" fill="url(#heroDarkBg2)"/>
  <rect width="1600" height="800" fill="url(#heroGlow2)"/>

  <!-- Floating Sparkles -->
  <g fill="#fae7a5" opacity="0.6">
    <circle cx="920" cy="190" r="2"/>
    <circle cx="1400" cy="260" r="3"/>
    <circle cx="1020" cy="650" r="2.5"/>
    <polygon points="1420,180 1424,190 1434,194 1424,198 1420,208 1416,198 1406,194 1416,190"/>
    <polygon points="880,480 883,488 891,491 883,494 880,502 877,494 869,491 877,488" opacity="0.4"/>
  </g>

  <!-- Foreground 24K Gold Card -->
  <g transform="translate(940, 160) rotate(-6) skewY(2)" filter="url(#cardShadow2)">
    <rect width="530" height="325" rx="18" fill="url(#goldCardGrad)"/>
    <rect width="530" height="325" rx="18" fill="none" stroke="#fff5d1" stroke-width="2.5"/>
    <rect x="18" y="18" width="494" height="289" rx="12" fill="none" stroke="#8c6716" stroke-opacity="0.4" stroke-width="1.2"/>
    
    <g transform="translate(48, 100)">
      <rect width="64" height="48" rx="8" fill="#ecd07a" stroke="#8c6716" stroke-width="1.2"/>
      <path d="M 0 24 L 64 24 M 22 0 L 22 48 M 42 0 L 42 48" stroke="#5a3f06" stroke-width="1.2"/>
    </g>

    <g transform="translate(132, 110)" stroke="#221b0a" stroke-width="2" fill="none">
      <path d="M 0 6 A 8 8 0 0 1 0 22"/>
      <path d="M 7 2 A 14 14 0 0 1 7 26"/>
      <path d="M 14 -2 A 20 20 0 0 1 14 30"/>
    </g>

    <g transform="translate(480, 50)">
      <text x="0" y="0" text-anchor="end" font-family="'Roboto Condensed', sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#140f02">FINE TOUCH</text>
      <text x="0" y="14" text-anchor="end" font-family="'Open Sans', sans-serif" font-size="8" font-weight="600" letter-spacing="1.5" fill="#5c440a">24K BRUSHED BRASS GOLD</text>
    </g>

    <g transform="translate(48, 235)">
      <text font-family="'Roboto Condensed', monospace" font-size="18" font-weight="700" letter-spacing="3" fill="#140f02">MAXIMILIAN DU PONT</text>
      <text y="20" font-family="'Open Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#382a08">EXECUTIVE BOARD CHAIRMAN</text>
    </g>
  </g>

  <!-- Background Brushed Stainless Steel Card -->
  <g transform="translate(850, 270) rotate(14) skewY(-5)" opacity="0.88" filter="url(#cardShadow2)">
    <rect width="490" height="300" rx="16" fill="#e2e8f0"/>
    <rect width="490" height="300" rx="16" fill="none" stroke="#ffffff" stroke-width="2"/>
    <g transform="translate(440, 44)">
      <text text-anchor="end" font-family="'Roboto Condensed', sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="#1e293b">STAINLESS STEEL 304</text>
    </g>
    <g transform="translate(48, 215)">
      <text font-family="'Roboto Condensed', monospace" font-size="16" font-weight="700" letter-spacing="3" fill="#0f172a">VICTORIA L. HARINGTON</text>
      <text y="18" font-family="'Open Sans', sans-serif" font-size="9" font-weight="600" letter-spacing="2" fill="#475569">CHIEF EXECUTIVE OFFICER</text>
    </g>
  </g>
</svg>
