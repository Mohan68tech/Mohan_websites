<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f58220"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#c59b27"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#f58220" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Subtle Luxury Emblem: Stylized Card Diamond & Crown Crest -->
  <g transform="translate(10, 8)" filter="url(#subtleGlow)">
    <rect x="6" y="6" width="32" height="20" rx="3" fill="none" stroke="url(#goldGrad)" stroke-width="1.8"/>
    <path d="M14 6 L22 14 L30 6" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="22" cy="18" r="2.2" fill="url(#goldGrad)"/>
    <line x1="12" y1="21" x2="32" y2="21" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.8"/>
    <!-- Precision corner marks -->
    <path d="M4 12 L4 4 L12 4" stroke="#f58220" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M40 32 L40 40 L32 40" stroke="#f58220" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  </g>
  
  <!-- Brand Typography -->
  <g transform="translate(62, 28)">
    <text font-family="'Roboto Condensed', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" letter-spacing="3.5" fill="#141416">FINE TOUCH</text>
    <text y="18" font-family="'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600" letter-spacing="4.5" fill="#f58220">METAL CARD • BESPOKE</text>
  </g>
</svg>
