<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" fill="none">
  <defs>
    <!-- Warm Rose Gold / Copper Metallic Gradient -->
    <linearGradient id="roseGoldBase" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#c8796b"/>
      <stop offset="25%" stop-color="#f6cdc4"/>
      <stop offset="50%" stop-color="#be6b5d"/>
      <stop offset="75%" stop-color="#f9ddd6"/>
      <stop offset="100%" stop-color="#a45548"/>
    </linearGradient>
    <linearGradient id="roseSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0ec" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#9a4d41" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fed6ce" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="brushedRoseTexture" width="500" height="2" patternUnits="userSpaceOnUse">
      <line x1="0" y1="1" x2="500" y2="1" stroke="#873e32" stroke-opacity="0.14" stroke-width="0.8"/>
    </pattern>
    <filter id="shadowRose" x="-5%" y="-5%" width="115%" height="118%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#58241c" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3d150f" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#shadowRose)">
    <rect x="40" y="30" width="620" height="380" rx="22" fill="url(#roseGoldBase)"/>
    <rect x="40" y="30" width="620" height="380" rx="22" fill="url(#brushedRoseTexture)"/>
    <rect x="40" y="30" width="620" height="380" rx="22" fill="none" stroke="url(#roseSheen)" stroke-width="2.5"/>
    <rect x="58" y="48" width="584" height="344" rx="16" fill="none" stroke="#7e372b" stroke-opacity="0.35" stroke-width="1.2"/>
  </g>

  <!-- Deep Warm Copper Laser Elements -->
  <g transform="translate(80, 140)">
    <rect x="0" y="0" width="76" height="56" rx="9" fill="#e9aba0" stroke="#7e372b" stroke-width="1.5"/>
    <path d="M 0 28 L 76 28 M 26 0 L 26 56 M 50 0 L 50 56 M 26 18 L 50 18 M 26 38 L 50 38" stroke="#541b12" stroke-width="1.4" fill="none"/>
    <circle cx="38" cy="28" r="7" fill="none" stroke="#541b12" stroke-width="1.4"/>
  </g>

  <g transform="translate(176, 150)" stroke="#2b0e09" stroke-width="2.2" fill="none" stroke-linecap="round">
    <path d="M 0 10 A 10 10 0 0 1 0 26" opacity="0.4"/>
    <path d="M 8 5 A 18 18 0 0 1 8 31" opacity="0.7"/>
    <path d="M 16 0 A 26 26 0 0 1 16 36"/>
  </g>

  <g transform="translate(560, 68)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#2b0e09" stroke-width="1.5"/>
    <path d="M -8 -4 L 0 6 L 8 -4 M 0 -11 L 0 11" stroke="#2b0e09" stroke-width="1.3" stroke-linecap="round"/>
    <text x="-4" y="32" text-anchor="end" font-family="'Roboto Condensed', sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#2b0e09">FINE TOUCH</text>
    <text x="-4" y="45" text-anchor="end" font-family="'Open Sans', sans-serif" font-size="8" font-weight="600" letter-spacing="2" fill="#58241c">ROSE GOLD COPPER</text>
  </g>

  <g transform="translate(80, 290)">
    <text font-family="'Roboto Condensed', monospace" font-size="21" font-weight="700" letter-spacing="4" fill="#240a06">CHLOE GENEVIEVE</text>
    <text y="24" font-family="'Open Sans', sans-serif" font-size="12" font-weight="600" letter-spacing="2.5" fill="#4a1810">CREATIVE DIRECTOR &amp; ARCHITECT</text>
    <text y="54" font-family="'Open Sans', sans-serif" font-size="11" font-weight="400" letter-spacing="2" fill="#713025">ATELIER HAUTE COUTURE</text>
  </g>

  <g transform="translate(590, 360)" text-anchor="end">
    <text font-family="'Roboto Condensed', monospace" font-size="11" font-weight="600" letter-spacing="2" fill="#58241c">0.5mm ROSE GOLD / COPPER • S/N 7810-RG</text>
  </g>
</svg>
