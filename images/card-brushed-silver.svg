<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" fill="none">
  <defs>
    <!-- Brushed Silver Horizontal Metallic Linear Gradient -->
    <linearGradient id="silverBase" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#e8ebed"/>
      <stop offset="20%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#d0d5dd"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="85%" stop-color="#cbd2db"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="silverSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="brushedSilverTexture" width="600" height="2" patternUnits="userSpaceOnUse">
      <line x1="0" y1="1" x2="600" y2="1" stroke="#94a3b8" stroke-opacity="0.14" stroke-width="0.75"/>
    </pattern>
    <filter id="shadowSilver" x="-5%" y="-5%" width="115%" height="118%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#334155" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#shadowSilver)">
    <!-- Base Card -->
    <rect x="40" y="30" width="620" height="380" rx="22" fill="url(#silverBase)"/>
    <rect x="40" y="30" width="620" height="380" rx="22" fill="url(#brushedSilverTexture)"/>
    <!-- Mirror Polished Edge -->
    <rect x="40" y="30" width="620" height="380" rx="22" fill="none" stroke="url(#silverSheen)" stroke-width="2.5"/>
    <!-- Engraved Card Border -->
    <rect x="58" y="48" width="584" height="344" rx="16" fill="none" stroke="#94a3b8" stroke-opacity="0.4" stroke-width="1.2"/>
  </g>

  <!-- Deep Engraved Black Laser Elements -->
  <!-- Chip Accent -->
  <g transform="translate(80, 140)">
    <rect x="0" y="0" width="76" height="56" rx="9" fill="#c7cfd9" stroke="#64748b" stroke-width="1.5"/>
    <path d="M 0 28 L 76 28 M 26 0 L 26 56 M 50 0 L 50 56 M 26 18 L 50 18 M 26 38 L 50 38" stroke="#475569" stroke-width="1.4" fill="none"/>
    <circle cx="38" cy="28" r="7" fill="none" stroke="#475569" stroke-width="1.4"/>
  </g>

  <g transform="translate(176, 150)" stroke="#1e293b" stroke-width="2.2" fill="none" stroke-linecap="round">
    <path d="M 0 10 A 10 10 0 0 1 0 26" opacity="0.4"/>
    <path d="M 8 5 A 18 18 0 0 1 8 31" opacity="0.7"/>
    <path d="M 16 0 A 26 26 0 0 1 16 36"/>
  </g>

  <g transform="translate(560, 68)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <path d="M -8 -4 L 0 6 L 8 -4 M 0 -11 L 0 11" stroke="#1e293b" stroke-width="1.3" stroke-linecap="round"/>
    <text x="-4" y="32" text-anchor="end" font-family="'Roboto Condensed', sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#1e293b">FINE TOUCH</text>
    <text x="-4" y="45" text-anchor="end" font-family="'Open Sans', sans-serif" font-size="8" font-weight="600" letter-spacing="2" fill="#64748b">BRUSHED STEEL 304</text>
  </g>

  <g transform="translate(80, 290)">
    <text font-family="'Roboto Condensed', monospace" font-size="21" font-weight="700" letter-spacing="4" fill="#0f172a">VICTORIA L. HARINGTON</text>
    <text y="24" font-family="'Open Sans', sans-serif" font-size="12" font-weight="600" letter-spacing="2.5" fill="#334155">CHIEF EXECUTIVE OFFICER</text>
    <text y="54" font-family="'Open Sans', sans-serif" font-size="11" font-weight="400" letter-spacing="2" fill="#64748b">HARINGTON GLOBAL WEALTH</text>
  </g>

  <g transform="translate(590, 360)" text-anchor="end">
    <text font-family="'Roboto Condensed', monospace" font-size="11" font-weight="600" letter-spacing="2" fill="#475569">0.5mm 304 STAINLESS STEEL • S/N 4012-SS</text>
  </g>
</svg>
