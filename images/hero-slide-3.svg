<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" fill="none">
  <defs>
    <radialGradient id="heroDarkBg3" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1c24"/>
      <stop offset="50%" stop-color="#0c0d12"/>
      <stop offset="100%" stop-color="#06070a"/>
    </radialGradient>
    <radialGradient id="heroGlow3" cx="62%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#f58220" stop-opacity="0.25"/>
      <stop offset="55%" stop-color="#b76e79" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titaniumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d313a"/>
      <stop offset="60%" stop-color="#17191e"/>
      <stop offset="100%" stop-color="#0e0f12"/>
    </linearGradient>
    <filter id="cardShadow3" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-15" dy="30" stdDeviation="35" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#f58220" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1600" height="800" fill="url(#heroDarkBg3)"/>
  <rect width="1600" height="800" fill="url(#heroGlow3)"/>

  <!-- High-Tech Circuit/Laser Matrix lines -->
  <g opacity="0.08" stroke="#f58220" stroke-width="1.2">
    <path d="M 750 150 L 900 150 L 950 200 L 1200 200"/>
    <path d="M 850 680 L 1050 680 L 1100 630 L 1400 630"/>
    <circle cx="950" cy="200" r="4" fill="#f58220"/>
    <circle cx="1100" cy="630" r="4" fill="#f58220"/>
  </g>

  <!-- Foreground Smart NFC & Laser Cutout Card -->
  <g transform="translate(940, 160) rotate(-7) skewY(2)" filter="url(#cardShadow3)">
    <rect width="530" height="325" rx="18" fill="url(#titaniumGrad)"/>
    <rect width="530" height="325" rx="18" fill="none" stroke="#484d59" stroke-width="2"/>
    
    <!-- Die Cut Slots -->
    <g opacity="0.6">
      <line x1="320" y1="20" x2="520" y2="220" stroke="#060709" stroke-width="6"/>
      <line x1="350" y1="20" x2="520" y2="190" stroke="#060709" stroke-width="6"/>
      <line x1="380" y1="20" x2="520" y2="160" stroke="#060709" stroke-width="6"/>
      <line x1="410" y1="20" x2="520" y2="130" stroke="#060709" stroke-width="6"/>
    </g>

    <!-- NFC Chip -->
    <g transform="translate(48, 95)">
      <rect width="68" height="52" rx="8" fill="#1b1d24" stroke="#f58220" stroke-width="1.5"/>
      <circle cx="34" cy="26" r="6" fill="#f58220"/>
    </g>

    <!-- NFC Waves -->
    <g transform="translate(136, 105)" stroke="#f58220" stroke-width="2.2" fill="none">
      <path d="M 0 6 A 8 8 0 0 1 0 22"/>
      <path d="M 7 2 A 14 14 0 0 1 7 26"/>
      <path d="M 14 -2 A 20 20 0 0 1 14 30"/>
    </g>

    <g transform="translate(480, 50)">
      <text x="0" y="0" text-anchor="end" font-family="'Roboto Condensed', sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#ffffff">FINE TOUCH</text>
      <text x="0" y="14" text-anchor="end" font-family="'Open Sans', sans-serif" font-size="8" font-weight="600" letter-spacing="1.5" fill="#f58220">SMART NFC &amp; DIE-CUT</text>
    </g>

    <g transform="translate(48, 235)">
      <text font-family="'Roboto Condensed', monospace" font-size="18" font-weight="700" letter-spacing="3" fill="#ffffff">SEBASTIAN K. CROSS</text>
      <text y="20" font-family="'Open Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#f58220">VENTURE CAPITALIST • TAP TO SHARE</text>
    </g>
  </g>

  <!-- Background Rose Gold Card -->
  <g transform="translate(860, 270) rotate(13) skewY(-5)" opacity="0.88" filter="url(#cardShadow3)">
    <rect width="490" height="300" rx="16" fill="#be6b5d"/>
    <rect width="490" height="300" rx="16" fill="none" stroke="#f9ddd6" stroke-width="2"/>
    <g transform="translate(440, 44)">
      <text text-anchor="end" font-family="'Roboto Condensed', sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="#2b0e09">ROSE GOLD / COPPER</text>
    </g>
    <g transform="translate(48, 215)">
      <text font-family="'Roboto Condensed', monospace" font-size="16" font-weight="700" letter-spacing="3" fill="#240a06">CHLOE GENEVIEVE</text>
      <text y="18" font-family="'Open Sans', sans-serif" font-size="9" font-weight="600" letter-spacing="2" fill="#58241c">ATELIER HAUTE COUTURE</text>
    </g>
  </g>
</svg>
