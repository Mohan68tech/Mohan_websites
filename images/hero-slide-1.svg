<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" fill="none">
  <defs>
    <radialGradient id="heroDarkBg1" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1b1c22"/>
      <stop offset="50%" stop-color="#0f1013"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
    <radialGradient id="heroGlow1" cx="65%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#f58220" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardMatte" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24262b"/>
      <stop offset="45%" stop-color="#131417"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </linearGradient>
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e5b869"/>
      <stop offset="50%" stop-color="#fef3d6"/>
      <stop offset="100%" stop-color="#caa043"/>
    </linearGradient>
    <filter id="cardShadow1" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-20" dy="35" stdDeviation="40" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#f58220" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Deep Luxury Dark Background -->
  <rect width="1600" height="800" fill="url(#heroDarkBg1)"/>
  <rect width="1600" height="800" fill="url(#heroGlow1)"/>

  <!-- Subtle Geometric Grid Lines in Dark Space -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="200" x2="1600" y2="200"/>
    <line x1="0" y1="400" x2="1600" y2="400"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="1200" y1="0" x2="1200" y2="800"/>
  </g>

  <!-- Floating Sparkles / Metallic Reflections -->
  <g fill="#f58220" opacity="0.4">
    <circle cx="850" cy="180" r="2"/>
    <circle cx="1450" cy="220" r="3"/>
    <circle cx="950" cy="620" r="2.5"/>
    <circle cx="1520" cy="550" r="1.5"/>
    <circle cx="1100" cy="710" r="2"/>
  </g>
  <g fill="#D4AF37" opacity="0.5">
    <polygon points="1350,150 1354,160 1364,164 1354,168 1350,178 1346,168 1336,164 1346,160"/>
    <polygon points="900,320 903,328 911,331 903,334 900,342 897,334 889,331 897,328" opacity="0.3"/>
  </g>

  <!-- 3D Perspective Floating Matte Black Card Presentation -->
  <g transform="translate(980, 150) rotate(-9) skewY(3)" filter="url(#cardShadow1)">
    <!-- Base Card -->
    <rect width="520" height="320" rx="18" fill="url(#cardMatte)"/>
    <rect width="520" height="320" rx="18" fill="none" stroke="#434752" stroke-width="2"/>
    <rect x="16" y="16" width="488" height="288" rx="12" fill="none" stroke="#25272e" stroke-width="1.2"/>
    
    <!-- Chip -->
    <g transform="translate(48, 100)">
      <rect width="64" height="48" rx="8" fill="url(#goldTextGrad)"/>
      <path d="M 0 24 L 64 24 M 22 0 L 22 48 M 42 0 L 42 48" stroke="#876316" stroke-width="1.2"/>
    </g>

    <!-- NFC Waves -->
    <g transform="translate(130, 110)" stroke="url(#goldTextGrad)" stroke-width="2" fill="none">
      <path d="M 0 6 A 8 8 0 0 1 0 22"/>
      <path d="M 7 2 A 14 14 0 0 1 7 26"/>
      <path d="M 14 -2 A 20 20 0 0 1 14 30"/>
    </g>

    <!-- Logo & Text -->
    <g transform="translate(470, 48)">
      <text x="0" y="0" text-anchor="end" font-family="'Roboto Condensed', sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="url(#goldTextGrad)">FINE TOUCH</text>
      <text x="0" y="14" text-anchor="end" font-family="'Open Sans', sans-serif" font-size="8" font-weight="600" letter-spacing="1.5" fill="#888c99">MATTE BLACK EDITION</text>
    </g>

    <g transform="translate(48, 230)">
      <text font-family="'Roboto Condensed', monospace" font-size="18" font-weight="700" letter-spacing="3" fill="url(#goldTextGrad)">ALEXANDER V. STERLING</text>
      <text y="20" font-family="'Open Sans', sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#a0a3ad">MANAGING PARTNER</text>
    </g>
  </g>

  <!-- Secondary Card Peeking from Behind (Brushed Brass) -->
  <g transform="translate(860, 240) rotate(12) skewY(-4)" opacity="0.85" filter="url(#cardShadow1)">
    <rect width="480" height="295" rx="16" fill="#cca22e"/>
    <rect width="480" height="295" rx="16" fill="none" stroke="#fae7a5" stroke-width="1.5"/>
    <g transform="translate(42, 90)">
      <rect width="58" height="42" rx="7" fill="#ebd283" stroke="#8c6716"/>
    </g>
    <g transform="translate(420, 40)">
      <text text-anchor="end" font-family="'Roboto Condensed', sans-serif" font-size="12" font-weight="700" letter-spacing="2.5" fill="#140f02">BRASS GOLD VIP</text>
    </g>
    <g transform="translate(42, 215)">
      <text font-family="'Roboto Condensed', monospace" font-size="16" font-weight="700" letter-spacing="3" fill="#140f02">VIP MEMBERSHIP CARD</text>
    </g>
  </g>
</svg>
