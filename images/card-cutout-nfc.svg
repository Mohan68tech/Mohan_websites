<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" fill="none">
  <defs>
    <!-- Gunmetal Titanium Matrix with Cut-Through Die-Cut Design -->
    <linearGradient id="gunmetalBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3139"/>
      <stop offset="50%" stop-color="#191b20"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>
    <linearGradient id="nfcGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f58220"/>
      <stop offset="50%" stop-color="#ffbf69"/>
      <stop offset="100%" stop-color="#f58220"/>
    </linearGradient>
    <filter id="shadowCutout" x="-5%" y="-5%" width="115%" height="118%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#shadowCutout)">
    <!-- Base Card Body -->
    <rect x="40" y="30" width="620" height="380" rx="22" fill="url(#gunmetalBase)"/>
    <!-- Outer chamfer -->
    <rect x="40" y="30" width="620" height="380" rx="22" fill="none" stroke="#484d59" stroke-width="2.5"/>

    <!-- Intricate Die-Cut Cut-Through Patterns (Showing Translucent Geometric Mesh) -->
    <!-- Pattern of modern diagonal cutouts with drop shadow simulation -->
    <g opacity="0.35">
      <line x1="380" y1="30" x2="660" y2="310" stroke="#000000" stroke-width="7"/>
      <line x1="410" y1="30" x2="660" y2="280" stroke="#000000" stroke-width="7"/>
      <line x1="440" y1="30" x2="660" y2="250" stroke="#000000" stroke-width="7"/>
      <line x1="470" y1="30" x2="660" y2="220" stroke="#000000" stroke-width="7"/>
      <line x1="500" y1="30" x2="660" y2="190" stroke="#000000" stroke-width="7"/>
      <line x1="530" y1="30" x2="660" y2="160" stroke="#000000" stroke-width="7"/>
      <line x1="560" y1="30" x2="660" y2="130" stroke="#000000" stroke-width="7"/>
    </g>

    <g opacity="0.8">
      <line x1="380" y1="30" x2="660" y2="310" stroke="#0c0d0f" stroke-width="5"/>
      <line x1="410" y1="30" x2="660" y2="280" stroke="#0c0d0f" stroke-width="5"/>
      <line x1="440" y1="30" x2="660" y2="250" stroke="#0c0d0f" stroke-width="5"/>
      <line x1="470" y1="30" x2="660" y2="220" stroke="#0c0d0f" stroke-width="5"/>
      <line x1="500" y1="30" x2="660" y2="190" stroke="#0c0d0f" stroke-width="5"/>
      <line x1="530" y1="30" x2="660" y2="160" stroke="#0c0d0f" stroke-width="5"/>
      <line x1="560" y1="30" x2="660" y2="130" stroke="#0c0d0f" stroke-width="5"/>
    </g>
  </g>

  <!-- Embedded Smart NFC Antenna Ring & Chip Outline -->
  <g transform="translate(80, 130)">
    <rect x="0" y="0" width="84" height="66" rx="10" fill="#20232a" stroke="url(#nfcGold)" stroke-width="1.8"/>
    <!-- Microchip and Circuit Traces -->
    <rect x="18" y="16" width="48" height="34" rx="4" fill="#15171c" stroke="#f58220" stroke-width="1.2"/>
    <circle cx="42" cy="33" r="6" fill="url(#nfcGold)"/>
    <path d="M 6 33 L 18 33 M 66 33 L 78 33 M 42 6 L 42 16 M 42 50 L 42 60" stroke="#f58220" stroke-width="1.4"/>
  </g>

  <!-- Dynamic NFC Tap Indicator -->
  <g transform="translate(190, 150)" stroke="url(#nfcGold)" stroke-width="2.4" fill="none" stroke-linecap="round">
    <path d="M 0 10 A 10 10 0 0 1 0 26" opacity="0.45"/>
    <path d="M 8 5 A 18 18 0 0 1 8 31" opacity="0.75"/>
    <path d="M 16 0 A 26 26 0 0 1 16 36"/>
    <text x="32" y="24" stroke="none" fill="url(#nfcGold)" font-family="'Open Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="2">TAP &amp; CONNECT NFC</text>
  </g>

  <!-- Top Right Luxury Cut-through branding -->
  <g transform="translate(560, 68)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="url(#nfcGold)" stroke-width="1.6"/>
    <path d="M -8 -4 L 0 6 L 8 -4 M 0 -11 L 0 11" stroke="url(#nfcGold)" stroke-width="1.4" stroke-linecap="round"/>
    <text x="-4" y="32" text-anchor="end" font-family="'Roboto Condensed', sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#ffffff">FINE TOUCH</text>
    <text x="-4" y="45" text-anchor="end" font-family="'Open Sans', sans-serif" font-size="8" font-weight="600" letter-spacing="2" fill="url(#nfcGold)">SMART NFC &amp; DIE-CUT</text>
  </g>

  <g transform="translate(80, 290)">
    <text font-family="'Roboto Condensed', monospace" font-size="21" font-weight="700" letter-spacing="4" fill="#ffffff">SEBASTIAN K. CROSS</text>
    <text y="24" font-family="'Open Sans', sans-serif" font-size="12" font-weight="600" letter-spacing="2.5" fill="url(#nfcGold)">TECH VENTURE CAPITALIST</text>
    <text y="54" font-family="'Open Sans', sans-serif" font-size="11" font-weight="400" letter-spacing="2" fill="#9da3b4">NFC TAP-TO-SHARE • DIGITAL PROFILE</text>
  </g>

  <g transform="translate(590, 360)" text-anchor="end">
    <text font-family="'Roboto Condensed', monospace" font-size="11" font-weight="600" letter-spacing="2" fill="#f58220">NFC TAP ENABLED • PRECISION DIE-CUT</text>
  </g>
</svg>
