<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" fill="none">
  <defs>
    <!-- Matte Black Background with Subtle Noise & Micro-Sheen -->
    <linearGradient id="matteBlackBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2024"/>
      <stop offset="35%" stop-color="#121315"/>
      <stop offset="70%" stop-color="#18191c"/>
      <stop offset="100%" stop-color="#0d0e10"/>
    </linearGradient>
    <linearGradient id="laserEngravedGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dfb15b"/>
      <stop offset="30%" stop-color="#fdf0cd"/>
      <stop offset="70%" stop-color="#c5993b"/>
      <stop offset="100%" stop-color="#dfb15b"/>
    </linearGradient>
    <linearGradient id="edgeSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44464d" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#2a2b2f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#555861" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="118%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <pattern id="brushedTexture" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="2" x2="4" y2="2" stroke="#ffffff" stroke-opacity="0.018" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Card Body -->
  <g filter="url(#shadow)">
    <!-- Outer Card Shell (Standard 85x54 Ratio) -->
    <rect x="40" y="30" width="620" height="380" rx="22" fill="url(#matteBlackBase)"/>
    <rect x="40" y="30" width="620" height="380" rx="22" fill="url(#brushedTexture)"/>
    <!-- Beveled Laser Chamfer Edge -->
    <rect x="40" y="30" width="620" height="380" rx="22" fill="none" stroke="url(#edgeSheen)" stroke-width="2.5"/>
    <!-- Subtle Inner Border -->
    <rect x="58" y="48" width="584" height="344" rx="16" fill="none" stroke="#2c2d33" stroke-width="1.2"/>
  </g>

  <!-- Precision Laser Etch Elements -->
  <!-- Smart EMV Metallic Chip Accent -->
  <g transform="translate(80, 140)">
    <rect x="0" y="0" width="76" height="56" rx="9" fill="url(#laserEngravedGold)" opacity="0.9"/>
    <!-- Chip Contact Patterns -->
    <path d="M 0 28 L 76 28 M 26 0 L 26 56 M 50 0 L 50 56 M 26 18 L 50 18 M 26 38 L 50 38" stroke="#876316" stroke-width="1.4" fill="none"/>
    <circle cx="38" cy="28" r="7" fill="none" stroke="#876316" stroke-width="1.4"/>
  </g>

  <!-- Contactless NFC Wave Icon -->
  <g transform="translate(176, 150)" stroke="url(#laserEngravedGold)" stroke-width="2.2" fill="none" stroke-linecap="round">
    <path d="M 0 10 A 10 10 0 0 1 0 26" opacity="0.4"/>
    <path d="M 8 5 A 18 18 0 0 1 8 31" opacity="0.7"/>
    <path d="M 16 0 A 26 26 0 0 1 16 36"/>
  </g>

  <!-- Top Right Luxury Logo -->
  <g transform="translate(560, 68)">
    <circle cx="0" cy="0" r="16" fill="none" stroke="url(#laserEngravedGold)" stroke-width="1.5"/>
    <path d="M -8 -4 L 0 6 L 8 -4 M 0 -11 L 0 11" stroke="url(#laserEngravedGold)" stroke-width="1.3" stroke-linecap="round"/>
    <text x="-4" y="32" text-anchor="end" font-family="'Roboto Condensed', sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="url(#laserEngravedGold)">FINE TOUCH</text>
    <text x="-4" y="45" text-anchor="end" font-family="'Open Sans', sans-serif" font-size="8" font-weight="600" letter-spacing="2" fill="#888c99">MATTE BLACK EDITION</text>
  </g>

  <!-- Cardholder Details (Deep Laser Etched) -->
  <g transform="translate(80, 290)">
    <text font-family="'Roboto Condensed', monospace" font-size="21" font-weight="700" letter-spacing="4" fill="url(#laserEngravedGold)">ALEXANDER V. STERLING</text>
    <text y="24" font-family="'Open Sans', sans-serif" font-size="12" font-weight="600" letter-spacing="2.5" fill="#a0a3ad">MANAGING PARTNER &amp; FOUNDER</text>
    <text y="54" font-family="'Open Sans', sans-serif" font-size="11" font-weight="400" letter-spacing="2" fill="#6c707d">FINE TOUCH LUXURY ASSETS GROUP</text>
  </g>

  <!-- Serial & Specification Stamp -->
  <g transform="translate(590, 360)" text-anchor="end">
    <text font-family="'Roboto Condensed', monospace" font-size="11" font-weight="600" letter-spacing="2" fill="#585c69">0.8mm STAINLESS STEEL • S/N 8921-FT</text>
  </g>
</svg>
